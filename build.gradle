plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = mod_group_id
base.archivesName = mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    // Include resources produced by `runClientData` in the built jar.
    // Datagen output is checked in so a clean clone builds without running the game.
    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            logLevel = org.slf4j.event.Level.DEBUG
        }

        // Client-dev: fast iteration world with the debug HUD and camera overlays available.
        client {
            client()
        }

        // Dedicated-server profile. Must load with zero net.minecraft.client resolution.
        server {
            server()
            programArgument '--nogui'
        }

        // Isolated structures for movement state, Form lifecycle, packets, saves and course objects.
        gameTestServer {
            type = 'gameTestServer'
        }

        // Produces tags, models, loot, language stubs and validation reports.
        clientData {
            clientData()
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
    }

    mods {
        "$mod_id" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    // Player Animation Library. Declared but NOT depended on: see docs/ANIMATION_ADAPTER.md.
    // PAL has no 1.21.11 artifact yet, so PlaneShift ships a built-in fallback pose driver.
    maven {
        name = 'KosmX'
        url = 'https://maven.kosmx.dev/'
        content { includeGroupByRegex 'dev\\.kosmx.*' }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // No third-party runtime dependencies. See docs/DEPENDENCY_POLICY.md.
    // Sodium / Lithium / Iris are compatibility *test targets* installed into a run
    // profile by hand -- never compile or runtime dependencies of this mod.
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_issue_url          : mod_issue_url
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs << '-Xlint:all,-processing,-serial' << '-parameters'
}

/*
 * Design Bible, "Repository and module layout":
 *   "A dedicated server must load the mod without resolving any net.minecraft.client
 *    class. Enforce this in CI."
 *
 * Scans compiled class constant pools for client-only references originating from
 * packages that are not client-side by contract.
 */
tasks.register('checkClientClassLeak') {
    group = 'verification'
    description = 'Fails if a common/server class references net.minecraft.client.'
    dependsOn tasks.named('classes')

    // Packages that are permitted to touch client classes.
    def allowedPrefixes = [
            'com/studio/planeshift/client/',
            'com/studio/planeshift/datagen/'
    ]
    def classesDir = layout.buildDirectory.dir('classes/java/main')
    inputs.dir(classesDir).withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.file(layout.buildDirectory.file('reports/planeshift/client-leak.txt'))

    doLast {
        def root = classesDir.get().asFile
        if (!root.exists()) return
        def offenders = []

        root.eachFileRecurse { f ->
            if (!f.name.endsWith('.class')) return
            def rel = root.toPath().relativize(f.toPath()).toString().replace('\\', '/')
            if (allowedPrefixes.any { rel.startsWith(it) }) return
            // ISO-8859-1 maps bytes 1:1, so this is an exact search over the constant pool.
            def text = new String(f.bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
            if (text.contains('net/minecraft/client')) {
                offenders << rel
            }
        }

        def report = file(layout.buildDirectory.file('reports/planeshift/client-leak.txt'))
        report.parentFile.mkdirs()
        report.text = offenders.isEmpty()
                ? "OK: no client class references outside ${allowedPrefixes}\n"
                : "LEAKED:\n" + offenders.join('\n') + '\n'

        if (!offenders.isEmpty()) {
            throw new org.gradle.api.GradleException(
                    "Dedicated-server safety violated. These classes reference net.minecraft.client " +
                            "but are not in a client-only package:\n  " + offenders.join('\n  ') +
                            "\nMove the code into com.studio.planeshift.client, or gate it behind a " +
                            "FMLEnvironment.dist check in a separate client class.")
        }
    }
}

tasks.named('check') { dependsOn 'checkClientClassLeak' }

/*
 * Guards the P-switch / ON-OFF-switch tick regression.
 *
 * `BlockPos.betweenClosed` over a course-sized box plus a `Level.getBlockState` per position is
 * ~60k chunk+section+palette lookups on a single block activation, which is measurable in the
 * server tick. `BlockAreaScan` does the same search per chunk section and rejects whole sections
 * from the palette, so it is the only place allowed to iterate a raw cuboid.
 */
tasks.register('checkNoRawCuboidScan') {
    group = 'verification'
    description = 'Fails if a class other than BlockAreaScan iterates a raw BlockPos cuboid.'
    dependsOn tasks.named('classes')

    // The scan helper is the sanctioned home for whole-box iteration.
    def allowedClasses = [
            'com/studio/planeshift/common/block/BlockAreaScan.class'
    ]
    def bannedMethods = ['betweenClosed', 'betweenClosedStream']
    def classesDir = layout.buildDirectory.dir('classes/java/main')
    inputs.dir(classesDir).withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.file(layout.buildDirectory.file('reports/planeshift/raw-cuboid-scan.txt'))

    doLast {
        def root = classesDir.get().asFile
        if (!root.exists()) return
        def offenders = []

        root.eachFileRecurse { f ->
            if (!f.name.endsWith('.class')) return
            def rel = root.toPath().relativize(f.toPath()).toString().replace('\\', '/')
            if (allowedClasses.contains(rel)) return
            // ISO-8859-1 maps bytes 1:1, so this is an exact search over the constant pool.
            def text = new String(f.bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
            if (!text.contains('net/minecraft/core/BlockPos')) return
            def hit = bannedMethods.find { text.contains(it) }
            if (hit != null) {
                offenders << "${rel} (${hit})".toString()
            }
        }

        def report = file(layout.buildDirectory.file('reports/planeshift/raw-cuboid-scan.txt'))
        report.parentFile.mkdirs()
        report.text = offenders.isEmpty()
                ? "OK: no raw BlockPos cuboid iteration outside ${allowedClasses}\n"
                : "RAW SCAN:\n" + offenders.join('\n') + '\n'

        if (!offenders.isEmpty()) {
            throw new org.gradle.api.GradleException(
                    "Raw BlockPos cuboid iteration found outside BlockAreaScan:\n  " + offenders.join('\n  ') +
                            "\nUse com.studio.planeshift.common.block.BlockAreaScan#findMatching, which skips " +
                            "unloaded chunks and rejects non-matching chunk sections from the palette instead of " +
                            "doing a Level.getBlockState lookup per block.")
        }
    }
}

tasks.named('check') { dependsOn 'checkNoRawCuboidScan' }

/*
 * Design Bible, "Music and audio". The mod previously registered 22 sound events against a
 * sounds.json of empty arrays with no OGG files on disk, so every cue was silently a no-op:
 * nothing failed, nothing played. This makes that state a build failure instead.
 *
 * Checks, for every event registered in ModSounds:
 *   - sounds.json declares it
 *   - its "sounds" array is non-empty
 *   - every file it names exists under assets/planeshift/sounds/
 *   - its subtitle key, if declared, is present in en_us.json
 * and flags sounds.json entries that no longer correspond to a registered event.
 */
tasks.register('checkSoundAssets') {
    group = 'verification'
    description = 'Fails if a registered sound event has no playable OGG behind it.'

    def modSources = file('src/main/java/com/studio/planeshift/common/registry/ModSounds.java')
    def soundsJson = file('src/main/resources/assets/planeshift/sounds.json')
    def langJson = file('src/main/resources/assets/planeshift/lang/en_us.json')
    def soundsDir = file('src/main/resources/assets/planeshift/sounds')

    inputs.file(modSources)
    inputs.file(soundsJson)
    inputs.file(langJson)
    inputs.dir(soundsDir).withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.file(layout.buildDirectory.file('reports/planeshift/sound-assets.txt'))

    doLast {
        def problems = []

        // register("sound.coin") -> sound.coin
        def registered = (modSources.text =~ /register\(\s*"([^"]+)"\s*\)/)
                .collect { it[1] } as Set

        def declared = new groovy.json.JsonSlurper().parse(soundsJson) as Map

        registered.each { event ->
            def entry = declared[event]
            if (entry == null) {
                problems << "event '${event}' is registered in ModSounds but missing from sounds.json"
                return
            }
            def entries = entry.sounds
            if (!entries) {
                problems << "event '${event}' has an empty \"sounds\" array, so it will never play"
                return
            }
            entries.each { s ->
                // An entry is either "namespace:path" or { "name": "namespace:path", ... }.
                def name = (s instanceof Map) ? s.name : s
                if (name == null) {
                    problems << "event '${event}' has a sound entry with no name"
                    return
                }
                def path = name.contains(':') ? name.substring(name.indexOf(':') + 1) : name
                def ogg = new File(soundsDir, "${path}.ogg")
                if (!ogg.isFile()) {
                    problems << "event '${event}' references '${name}' but ${ogg.name} does not exist"
                } else if (ogg.length() == 0L) {
                    problems << "event '${event}' references '${name}' but ${ogg.name} is empty"
                }
            }
        }

        declared.keySet().findAll { !registered.contains(it) }.each {
            problems << "sounds.json declares '${it}', which no longer matches a registered event"
        }

        // Subtitles are the accessibility surface for these cues; a missing key renders raw.
        def lang = new groovy.json.JsonSlurper().parse(langJson) as Map
        declared.each { event, entry ->
            def subtitle = entry.subtitle
            if (subtitle != null && !lang.containsKey(subtitle)) {
                problems << "event '${event}' declares subtitle '${subtitle}', absent from en_us.json"
            }
        }

        def report = file(layout.buildDirectory.file('reports/planeshift/sound-assets.txt'))
        report.parentFile.mkdirs()
        report.text = problems.isEmpty()
                ? "OK: ${registered.size()} registered sound events, all backed by an OGG file\n"
                : "SOUND ASSET PROBLEMS:\n" + problems.join('\n') + '\n'

        if (!problems.isEmpty()) {
            throw new org.gradle.api.GradleException(
                    "Registered sound events have nothing to play:\n  " + problems.join('\n  ') +
                            "\nRegenerate with: java tools/SoundGen.java <wavDir> then encode to OGG " +
                            "into src/main/resources/assets/planeshift/sounds/ (see tools/README.md).")
        }
    }
}

tasks.named('check') { dependsOn 'checkSoundAssets' }

/*
 * Texture coverage and distinctness.
 *
 * Two failures this guards against, both of which were live:
 *   - Missing files. Every projectile entity and all ten mob effect icons had no texture at all,
 *     which renders as the missing-texture checkerboard rather than failing anything.
 *   - Indistinguishable files. 24 of the 73 placeholders were byte-identical to another, including
 *     hammer_bro/koopa and brick_block/secret_passage. A greybox that cannot be told apart is
 *     worse than useless during playtesting, and a secret passage that looks exactly like a brick
 *     is a gameplay bug rather than an art gap.
 *
 * Items are deliberately not coverage-checked: ModItems registers charms with a second Form-id
 * argument, so the registration names cannot be extracted unambiguously by regex. The duplicate
 * and empty-file checks below still cover every item texture.
 */
tasks.register('checkTextureAssets') {
    group = 'verification'
    description = 'Fails on a registered block/entity/effect/particle with no texture, or on two identical textures.'

    def registryDir = file('src/main/java/com/studio/planeshift/common/registry')
    def texturesDir = file('src/main/resources/assets/planeshift/textures')

    inputs.dir(registryDir).withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.dir(texturesDir).withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.file(layout.buildDirectory.file('reports/planeshift/texture-assets.txt'))

    // registry source -> the textures/ subdirectory its entries must appear in
    def coverage = [
            'ModBlocks.java'   : 'block',
            'ModEntities.java' : 'entity',
            'ModEffects.java'  : 'mob_effect',
            'ModParticles.java': 'particle'
    ]

    doLast {
        def problems = []

        coverage.each { sourceName, dirName ->
            def source = new File(registryDir, sourceName)
            if (!source.isFile()) {
                problems << "registry source ${sourceName} not found"
                return
            }
            // Only the first string argument of a register(...) call is the registration name;
            // ModEffects also uses PlaneShift.id("...") for attribute modifiers, which are not
            // registry entries and must not be matched.
            def names = (source.text =~ /\.register(?:Block|Item)?\(\s*"([a-z0-9_]+)"/).collect { it[1] } as Set
            if (names.isEmpty()) {
                problems << "no register(...) names parsed out of ${sourceName}"
                return
            }
            names.each { name ->
                def png = new File(texturesDir, "${dirName}/${name}.png")
                if (!png.isFile()) {
                    problems << "${dirName}/${name}.png missing for entry '${name}' in ${sourceName}"
                }
            }
        }

        // Distinctness and non-emptiness across the whole tree.
        def byDigest = [:].withDefault { [] }
        texturesDir.eachFileRecurse { f ->
            if (!f.name.endsWith('.png')) return
            def rel = texturesDir.toPath().relativize(f.toPath()).toString().replace('\\', '/')
            if (f.length() == 0L) {
                problems << "${rel} is empty"
                return
            }
            def digest = java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString()
            byDigest[digest] << rel
        }
        byDigest.each { digest, files ->
            if (files.size() > 1) {
                problems << "identical textures, cannot be told apart in game: " + files.sort().join(', ')
            }
        }

        def report = file(layout.buildDirectory.file('reports/planeshift/texture-assets.txt'))
        report.parentFile.mkdirs()
        report.text = problems.isEmpty()
                ? "OK: ${byDigest.values().flatten().size()} textures, all present and mutually distinct\n"
                : "TEXTURE PROBLEMS:\n" + problems.join('\n') + '\n'

        if (!problems.isEmpty()) {
            throw new org.gradle.api.GradleException(
                    "Texture assets are incomplete or ambiguous:\n  " + problems.join('\n  ') +
                            "\nRegenerate with: java tools/TextureGen.java " +
                            "src/main/resources/assets/planeshift/textures (see tools/README.md).")
        }
    }
}

tasks.named('check') { dependsOn 'checkTextureAssets' }

/*
 * Model and blockstate integrity.
 *
 * A blockstate pointing at a model that does not exist, or a model naming a texture that does
 * not exist, does not fail anything at build time and only shows up as a black-and-magenta
 * block in game. Malformed JSON is worse: the block silently falls back and the log line is
 * easy to miss. Both are cheap to catch here.
 *
 * Also flags a blockstate whose variants all resolve to the same model, which is what made
 * on_off_block (solid when on, walk-through when off) and question_block (used vs unused)
 * indistinguishable in world.
 */
tasks.register('checkBlockModels') {
    group = 'verification'
    description = 'Fails on malformed model/blockstate JSON, dangling model or texture references, or a multi-state block that renders identically in every state.'

    def assetsDir = file('src/main/resources/assets/planeshift')
    def packMeta = file('src/main/resources/pack.mcmeta')
    inputs.dir(assetsDir).withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.file(packMeta)
    outputs.file(layout.buildDirectory.file('reports/planeshift/block-models.txt'))

    doLast {
        def problems = []
        def slurper = new groovy.json.JsonSlurper()

        // planeshift:block/foo -> assets/planeshift/<kind>/block/foo.<ext>
        def resolve = { String ref, String kind, String ext ->
            if (ref == null || !ref.startsWith('planeshift:')) return null   // vanilla refs are fine
            new File(assetsDir, "${kind}/${ref.substring('planeshift:'.length())}.${ext}")
        }

        def parse = { File f ->
            try {
                return slurper.parse(f)
            } catch (Exception e) {
                problems << "${f.name} is not valid JSON: ${e.message}"
                return null
            }
        }

        // Models: every texture value and every parent must resolve.
        def modelsDir = new File(assetsDir, 'models')
        if (modelsDir.isDirectory()) {
            modelsDir.eachFileRecurse { f ->
                if (!f.name.endsWith('.json')) return
                def model = parse(f)
                if (model == null) return
                def parent = resolve(model.parent as String, 'models', 'json')
                if (parent != null && !parent.isFile()) {
                    problems << "${f.name} extends missing model '${model.parent}'"
                }
                (model.textures ?: [:]).each { slot, ref ->
                    // "#all" and friends refer to another slot in the same model, not a file.
                    if (ref instanceof String && !ref.startsWith('#')) {
                        def png = resolve(ref, 'textures', 'png')
                        if (png != null && !png.isFile()) {
                            problems << "${f.name} slot '${slot}' names missing texture '${ref}'"
                        }
                    }
                }
            }
        }

        /*
         * Item model definitions. Since 1.21.4 an item needs assets/<ns>/items/<id>.json naming
         * its model; a model under models/item/ alone is not enough. Without it the game logs
         * "No model loaded for default item model ID" and renders the missing-model block — which
         * is exactly what every one of this mod's items did, with nothing failing at build time.
         */
        def itemModelsDir = new File(assetsDir, 'models/item')
        def itemDefsDir = new File(assetsDir, 'items')
        if (itemModelsDir.isDirectory()) {
            itemModelsDir.eachFile { f ->
                if (!f.name.endsWith('.json')) return
                if (!new File(itemDefsDir, f.name).isFile()) {
                    problems << "models/item/${f.name} has no items/${f.name} definition, " +
                            "so the item renders as a missing model"
                }
            }
        }
        if (itemDefsDir.isDirectory()) {
            itemDefsDir.eachFile { f ->
                if (!f.name.endsWith('.json')) return
                def def_ = parse(f)
                if (def_ == null) return
                def ref = def_.model?.model as String
                def target = resolve(ref, 'models', 'json')
                if (target != null && !target.isFile()) {
                    problems << "items/${f.name} names missing model '${ref}'"
                }
            }
        }

        // Blockstates: every variant model must resolve, and states must be distinguishable.
        def statesDir = new File(assetsDir, 'blockstates')
        if (statesDir.isDirectory()) {
            statesDir.eachFile { f ->
                if (!f.name.endsWith('.json')) return
                def state = parse(f)
                if (state == null) return
                def variants = state.variants
                if (variants == null) return

                // A variant's appearance is its model plus its rotation: facing states legitimately
                // reuse one model at different y angles, and that is not a readability problem.
                def looks = [] as List
                variants.each { key, value ->
                    def entries = (value instanceof List) ? value : [value]
                    entries.each { entry ->
                        def ref = entry?.model as String
                        looks << "${ref}|x=${entry?.x ?: 0}|y=${entry?.y ?: 0}".toString()
                        def target = resolve(ref, 'models', 'json')
                        if (target != null && !target.isFile()) {
                            problems << "${f.name} variant '${key}' names missing model '${ref}'"
                        }
                    }
                }
                if (variants.size() > 1 && looks.toUnique().size() == 1) {
                    problems << "${f.name} has ${variants.size()} variants that all render " +
                            "identically as '${looks[0].split(/\|/)[0]}', so its states cannot be " +
                            "told apart in game"
                }
            }
        }

        /*
         * pack.mcmeta. Above resource-pack format 64 the game requires min_format/max_format and
         * rejects the older pack_format + supported_formats spelling outright, logging
         * "Couldn't load mod/planeshift pack metadata" and falling back. The same file is read
         * once as a resource pack and once as a data pack, and those formats differ (75.0 vs
         * 94.1 on 1.21.11), so the declared range has to span both.
         */
        def mcmeta = file('src/main/resources/pack.mcmeta')
        if (!mcmeta.isFile()) {
            problems << 'pack.mcmeta is missing'
        } else {
            def meta = parse(mcmeta)
            def pack = meta?.pack
            if (pack != null) {
                if (pack.min_format == null || pack.max_format == null) {
                    problems << 'pack.mcmeta must declare both min_format and max_format; ' +
                            'pack_format/supported_formats is rejected above format 64'
                } else {
                    // PackFormat.validateNewFormat requires min_format's major to exceed
                    // lastPreMinorVersion, or it demands the legacy supported_formats field.
                    // That cutoff is 64 for CLIENT_RESOURCES but 81 for SERVER_DATA, and one
                    // file is read as both — so the data cutoff is the binding one. Declaring
                    // 75 (the resource format) satisfies the client and fails the server.
                    def minMajor = (pack.min_format instanceof List)
                            ? pack.min_format[0] as int : pack.min_format as int
                    if (minMajor <= 81) {
                        problems << "pack.mcmeta min_format major is ${minMajor}; it must exceed 81 " +
                                '(SERVER_DATA lastPreMinorVersion) or the game demands the legacy ' +
                                'supported_formats field when reading the jar as a data pack'
                    }
                }
                if (pack.pack_format != null || pack.supported_formats != null) {
                    problems << 'pack.mcmeta still carries the superseded pack_format/' +
                            'supported_formats fields'
                }
            }
        }

        def report = file(layout.buildDirectory.file('reports/planeshift/block-models.txt'))
        report.parentFile.mkdirs()
        report.text = problems.isEmpty()
                ? "OK: models and blockstates parse, resolve, and distinguish their states\n"
                : "MODEL PROBLEMS:\n" + problems.join('\n') + '\n'

        if (!problems.isEmpty()) {
            throw new org.gradle.api.GradleException(
                    "Model or blockstate problems:\n  " + problems.join('\n  '))
        }
    }
}

tasks.named('check') { dependsOn 'checkBlockModels' }

/*
 * Data-pack values against their codec ranges.
 *
 * A datapack JSON that parses as valid JSON but violates its codec's numeric range is invisible
 * to the build and only fails at world load, where it takes the whole server down with
 * "Failed to load datapacks, can't proceed with server load". That is exactly what happened when
 * a script multiplied every role's jump_multiplier by 1.5 and pushed it outside the 0.85-1.15
 * contract PlayerRole declares: the build stayed green and no world could be created.
 *
 * The ranges are PARSED OUT of the codec source rather than duplicated here, so widening a
 * contract in Java automatically widens this check instead of leaving it stale.
 */
tasks.register('checkDataRanges') {
    group = 'verification'
    description = 'Fails if a datapack JSON value falls outside the numeric range its codec declares.'

    // codec source -> the datapack directory whose entries it decodes
    def sources = [
            'src/main/java/com/studio/planeshift/common/role/PlayerRole.java':
                    'src/main/resources/data/planeshift/planeshift/role',
            'src/main/java/com/studio/planeshift/common/course/CourseDefinition.java':
                    'src/main/resources/data/planeshift/planeshift/course'
    ]
    sources.each { src, dir ->
        inputs.file(file(src))
        if (file(dir).isDirectory()) {
            inputs.dir(file(dir)).withPathSensitivity(PathSensitivity.RELATIVE)
        }
    }
    outputs.file(layout.buildDirectory.file('reports/planeshift/data-ranges.txt'))

    doLast {
        def problems = []
        def checked = 0
        def slurper = new groovy.json.JsonSlurper()

        sources.each { srcPath, dirPath ->
            def src = file(srcPath)
            def dir = file(dirPath)
            if (!src.isFile() || !dir.isDirectory()) {
                return
            }
            // Codec.floatRange(0.85F, 1.15F).optionalFieldOf("run_multiplier", ...)
            // Codec.intRange(0, 60).optionalFieldOf("float_ticks", ...)  /  .fieldOf("x")
            def pattern = ~/(?:float|int|double)Range\(\s*([-\d.]+)F?\s*,\s*([-\d.]+)F?\s*\)\s*\.\s*(?:optionalF|f)ieldOf\(\s*"([a-z0-9_]+)"/
            def ranges = [:]
            src.text.findAll(pattern) { full, min, max, name ->
                ranges[name] = [min as double, max as double]
            }
            if (ranges.isEmpty()) {
                problems << "no numeric codec ranges parsed out of ${src.name}; the check would " +
                        "pass vacuously"
                return
            }

            dir.eachFile { f ->
                if (!f.name.endsWith('.json')) return
                def json
                try {
                    json = slurper.parse(f)
                } catch (Exception e) {
                    problems << "${dirPath}/${f.name} is not valid JSON: ${e.message}"
                    return
                }
                if (!(json instanceof Map)) return
                ranges.each { field, bounds ->
                    def value = json[field]
                    if (value instanceof Number) {
                        checked++
                        double v = value.doubleValue()
                        if (v < bounds[0] || v > bounds[1]) {
                            problems << "${dirPath}/${f.name}: ${field} is ${v}, outside the " +
                                    "[${bounds[0]}, ${bounds[1]}] range ${src.name} declares"
                        }
                    }
                }
            }
        }

        def report = file(layout.buildDirectory.file('reports/planeshift/data-ranges.txt'))
        report.parentFile.mkdirs()
        report.text = problems.isEmpty()
                ? "OK: ${checked} datapack values within their declared codec ranges\n"
                : "DATA RANGE PROBLEMS:\n" + problems.join('\n') + '\n'

        if (!problems.isEmpty()) {
            throw new org.gradle.api.GradleException(
                    "Datapack values violate their codec ranges:\n  " + problems.join('\n  ') +
                            "\nThese parse as valid JSON and only fail at world load, taking the " +
                            "server down. Fix the value, or widen the range in the codec if the " +
                            "contract genuinely changed.")
        }
    }
}

tasks.named('check') { dependsOn 'checkDataRanges' }

tasks.named('jar', Jar) {
    manifest {
        attributes([
                'Specification-Title'     : mod_name,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : mod_name,
                'Implementation-Version'  : mod_version,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) { from components.java }
    }
    repositories {
        maven { url = "file://${project.projectDir}/repo" }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

/*
 * Unit tests. The geometry in the client input projection is pure trigonometry that can be
 * checked without launching the game, so it gets a real test rather than a bytecode scan.
 * MDG puts the Minecraft/NeoForge classes on the test classpath via `unitTest`.
 */
neoForge {
    unitTest {
        enable()
        testedMod = mods."$mod_id"
    }
}

dependencies {
    testImplementation platform("org.junit:junit-bom:5.13.4")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging { events 'passed', 'failed', 'skipped' }
}
