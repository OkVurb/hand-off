# PlaneShift build properties.
#
# TARGET POLICY (Design Bible - "Production baseline"):
#   Pin exact Minecraft, loader, mapping/tool plugin, animation-library and Gradle-wrapper
#   versions. Never silently upgrade during a milestone. Upgrade on a branch, run the
#   compatibility matrix, and attach a migration report.
#
# Verified available on maven.neoforged.net at the time of pinning.

org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.debug=false

## Environment properties -- these five move together, never individually.
minecraft_version=1.21.11
minecraft_version_range=[1.21.11,1.22)
neo_version=21.11.45
neo_version_range=[21.11.0,)
loader_version_range=[4,)

## Mod properties
mod_id=planeshift
mod_name=PlaneShift
mod_license=MIT
mod_version=0.1.0
mod_group_id=com.studio.planeshift
mod_authors=PlaneShift Team
mod_description=A platform adventure for Minecraft that shifts between precise 2.5D side-on courses and free 3D exploration, with your own skin at the centre.
mod_issue_url=https://github.com/planeshift/planeshift/issues
